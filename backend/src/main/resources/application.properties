spring.application.name=backend

# ── Server ────────────────────────────────────────────────────────────────────
# Render injects the port via $PORT; fall back to 8080 locally.
server.port=${PORT:8080}

# ── Database (PostgreSQL) ──────────────────────────────────────────────────────
# On Render: set DATABASE_URL to the Internal Database URL provided by Render Postgres.
# Locally: set it to jdbc:postgresql://localhost:5432/disease_prediction
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/disease_prediction}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── JWT secret (set JWT_SECRET env var on Render to a long random string) ─────
jwt.secret=${JWT_SECRET:DevOnlyKeyForDiseasePredictionProject2026-ChangeMe!KeepItLong}

# ── CORS allowed origin (set ALLOWED_ORIGIN to your Render frontend URL) ──────
cors.allowed-origin=${ALLOWED_ORIGIN:http://localhost:5173}